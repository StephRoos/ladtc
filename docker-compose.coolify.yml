# Coolify production compose — UM790 Pro with NAS storage
# Managed by Coolify — auto-deployed on push to master
# Set environment variables in Coolify's UI (not in this file)
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ladtc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* must be passed as build args so Next.js can inline them
        # into the client bundle during `pnpm build`. Setting them only under
        # `environment:` (runtime) leaves the bundle pointing at the default
        # localhost:3000, which the browser CSP then blocks.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    environment:
      # Next.js standalone binds to HOSTNAME — must be 0.0.0.0 for Docker healthcheck
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ladtc}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
    labels:
      # Traefik labels — Cloudflare Tunnel delivers HTTP, so no redirect-to-https
      - "traefik.enable=true"
      - "traefik.http.middlewares.gzip.compress=true"
      # HTTP routers (Cloudflare Tunnel → port 80 → Traefik)
      - "traefik.http.routers.ladtc-http.entryPoints=http"
      - "traefik.http.routers.ladtc-http.rule=Host(`ladtc.be`) || Host(`www.ladtc.be`)"
      - "traefik.http.routers.ladtc-http.middlewares=gzip"
      - "traefik.http.routers.ladtc-http.service=ladtc"
      # HTTPS routers (direct access / Let's Encrypt)
      - "traefik.http.routers.ladtc-https.entryPoints=https"
      - "traefik.http.routers.ladtc-https.rule=Host(`ladtc.be`) || Host(`www.ladtc.be`)"
      - "traefik.http.routers.ladtc-https.middlewares=gzip"
      - "traefik.http.routers.ladtc-https.tls=true"
      - "traefik.http.routers.ladtc-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ladtc-https.service=ladtc"
      # Service
      - "traefik.http.services.ladtc.loadbalancer.server.port=3000"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
